
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Asistente Benmac VR</title>
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Luz y cámara -->
      <a-light type="ambient" color="#ccc"></a-light>
      <a-camera position="0 1.6 2"></a-camera>

      <!-- Avatar -->
      <a-assets>
        <a-asset-item id="avatarModel" src="avatar.glb"></a-asset-item>
        <audio id="voz" src="voz.mp3"></audio>
      </a-assets>

      <a-entity id="avatar"
                gltf-model="#avatarModel"
                position="0 0 -2"
                animation="property=rotation; to=0 20 0; loop:true; dur=3000; easing=linear">
      </a-entity>

      <!-- Suelo y fondo neutro -->
      <a-plane rotation="-90 0 0" width="10" height="10" color="#e0e0e0"></a-plane>
      <a-sky color="#dfefff"></a-sky>
    </a-scene>

    <script>
      window.addEventListener('load', () => {
        const audio = document.getElementById('voz');
        audio.play();
        audio.addEventListener('ended', () => {
          window.location.href = "https://benmac.edu.mx";
        });
      });
    </script>
  </body>
</html>
